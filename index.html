<!doctype html>
<html lang="en" data-state="unknown">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#EDEBE6">
  <meta name="description" content="Flight Control: your operational roster companion.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Flight Control">
  <title>Flight Control</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <script>
    // Theme bootstrap: runs before first paint so a stored theme never flashes.
    // 'system' (or nothing stored) leaves data-theme unset → prefers-color-scheme decides.
    try {
      var t = localStorage.getItem('fc.v2.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/shell.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/screens.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="review-banner" id="review-banner" role="status" hidden>Review mode · Sample data · Not your roster</div>
  <section class="review-dock" id="review-dock" aria-label="Review mode controls" hidden></section>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main" tabindex="-1">
      <noscript><p>Flight Control requires JavaScript.</p></noscript>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
